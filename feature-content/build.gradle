plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'com.openapi.feature.content'

    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles = ["consumer-rules.pro"]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            consumerProguardFiles "consumer-rules.pro"
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    lintOptions {
        checkReleaseBuilds = false
        abortOnError = false
        ignoreWarnings = true
        quiet = true
        disable 'deprecation'
        disable 'unchecked'
        disable 'all'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose = true
        viewBinding = true
    }
}

dependencies {
    // 列表骨架屏（IndexRecommendAdapter 使用，原在 :core）
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    // 频道与推荐列表、频道详情、声音/图片/文字/视频频道页、收藏、搜索
    api project(':commonutil')
    implementation project(':core')
    // 字幕翻译框架（原在 :commonutil）
    implementation project(':media')
    // 声音页的播放后端（频道歌单和本地音乐共用 :retromusic 的播放队列）
    implementation project(':retromusic')
    // :retromusic 的 MusicPlayerRemote 使用 Koin 注入
    implementation 'io.insert-koin:koin-core:3.5.6'
    implementation 'io.insert-koin:koin-android:3.5.6'
    implementation libs.google.material

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.kotlinx.coroutines.android
}
