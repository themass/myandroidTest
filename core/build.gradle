plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: rootProject.file('gradle/android-library.gradle')

android {
    namespace = 'com.openapi.core'
    buildFeatures {
        compose = true
        viewBinding = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.7.0'
    implementation libs.androidx.recyclerview
    // 工具类（com.openapi.core.util/net/event 等）在 :commonutil
    api project(':common')
    implementation project(':subtitle')
    implementation project(':uikit')
    implementation project(':network')
    // 字幕翻译框架（MyFavoriteView 使用，原在 :commonutil）
    // 广告 SDK（AdsContext、AdsManager 等，来自 :ads）
    implementation project(':ads')
    // Material 组件（AppBarLayout、FloatingActionButton 等，ui/base 使用）
    implementation libs.google.material
    // 列表骨架屏（IndexRecommendAdapter）与水波纹背景（MyRadarScanView）
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.skyfishjy.ripplebackground:library:1.0.1'

    // 网络
    implementation libs.okhttp

    // 图片加载（SaveImageTask）
    implementation libs.glide

    // 协程
    implementation libs.kotlinx.coroutines.android

    // 音频播放（media/AudioPlayer）
    implementation libs.androidx.media3.exoplayer

    // 拍照解题图片处理（photosolve/image、quality、cropassist：OpenCV + ONNX Runtime）

    // 数据库（Room；data/db 的 DAO 和实体在本模块生成实现）
    // AppDatabase（继承 RoomDatabase）和 DAO 是对外接口，所以 Room 运行时用 api
    api libs.androidx.room.runtime
    annotationProcessor libs.androidx.room.compiler

    // Compose（design/、cast/ui、permission 对话框）
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.activity.compose

    // AndroidX
    implementation libs.androidx.appcompat
    implementation libs.androidx.activity
}
