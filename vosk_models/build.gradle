apply plugin: 'com.android.library'

android {
    compileSdk 33
    defaultConfig {
        minSdk 28
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    buildFeatures {
        buildConfig = false
    }
    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/assets"
        }
    }
}

