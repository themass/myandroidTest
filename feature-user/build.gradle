plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: rootProject.file('gradle/android-library.gradle')

android {
    namespace = 'com.openapi.feature.user'
    buildFeatures {
        compose = true
        viewBinding = true
    }
}

dependencies {
    implementation libs.androidx.recyclerview
    // 登录、注册、找回密码、个人设置、意见反馈、设置角色
    implementation project(':common')
    // 设置页的广告和统计
    implementation project(':core')
    // 分享（替代原 commonutil 的 ShareUtil）
    // 设置页使用播放器引擎开关（PlaybackEngineHelper，在 :feature-video）
    implementation libs.google.material

    // 「我的」页头像：本地生成结果用 Coil 读文件（与 chatkit/feature-companion 同版本，升级一起改）
    implementation 'io.coil-kt:coil-compose:2.7.0'

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.kotlinx.coroutines.android

    testImplementation 'junit:junit:4.13.2'
    testImplementation libs.kotlinx.coroutines.test
    // AvatarGenRemote 的用例要真起本地 HTTP（MockWebServer 必须跟 libs.okhttp=5.0.0 同族，
    // 4.x 编译自 okhttp4 internal，与 5.x 同 classpath 会 NoClassDefFoundError——与 :common 同款注释）。
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.0.0'
}
