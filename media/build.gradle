plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// :media：媒体能力（语音、字幕、图像、媒体查看）。
// 阶段 3 的第一步：:asr 和 :mediaview 合并到这里，包名暂不改（阶段 9 统一改）。
apply from: rootProject.file('gradle/android-library.gradle')

android {
    namespace = 'com.openapi.media'
    buildFeatures {
        compose = true
    }
}

dependencies {
    // 通用工具（PreferenceUtils、LogUtil 等），不依赖 :core
    implementation project(':commonutil')

    // 火山引擎流式 ASR 的 WebSocket / 协议
    implementation libs.okhttp
    // 音频播放（AudioPlayer）和实时字幕的 PCM 音频源（ExoPlayerPcmAudioSource）
    implementation libs.androidx.media3.exoplayer

    // 文档裁剪、超分的推理（ONNX Runtime，原在 :core）
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.1'
    // 图像预处理（ImagePipeline 用 OpenCV，原在 :core）
    implementation 'org.opencv:opencv:4.12.0'

    // 协程：流式识别、设备朗读的挂起封装
    implementation libs.kotlinx.coroutines.android

    // Compose：媒体查看组件（MediaStack、MediaOverlap 等）
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.core.ktx
    implementation 'io.coil-kt:coil-compose:2.7.0'
    debugImplementation libs.androidx.compose.ui.tooling
}
