plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: rootProject.file('gradle/android-library.gradle')

android {
    namespace = 'com.openapi.common'
    buildFeatures {
        compose = true
        viewBinding = true
    }
}

dependencies {
    // ---- 纯工具（util/ event/ image/）
    // 事件 Flow（EventFlows）
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.core.ktx
    // FileUtils 用 DocumentFile 处理 SAF 目录
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // image/ImageUtils 按 EXIF 方向解码照片
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // ---- 网络（net/）
    // 对外接口里有 OkHttp、Gson、Glide 的类型，所以用 api
    api libs.gson
    api libs.okhttp
    api libs.okhttp.logging
    api libs.glide
    api libs.glide.okhttp3

    // ---- 通用界面（ui/）
    implementation libs.androidx.appcompat
    implementation libs.androidx.activity
    implementation libs.androidx.recyclerview
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.material3
    // 分享卡片的二维码
    implementation 'com.google.zxing:core:3.5.3'

    // ---- 广告（ads/）
    // AdsContext 等对外接口里有 GMS 的类型，所以用 api
    api 'com.google.android.gms:play-services-ads:24.9.0'
    implementation 'com.google.android.gms:play-services-wallet:19.5.0'

    // 纯 Kotlin/Java 逻辑的单测（存储目录统计等）
    testImplementation 'junit:junit:4.13.2'

}