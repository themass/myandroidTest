plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// :subtitle：音视频翻译接口、字幕覆盖层、实时字幕（火山引擎流式 ASR + PCM 音频源）。
// 不依赖具体播放器：调用方通过 TranslationOverlaySession、PlaybackProbe 等接口提供播放状态。
apply from: rootProject.file('gradle/android-library.gradle')

android {
    namespace = 'com.openapi.subtitle'
}

dependencies {
    implementation project(':common')
    // 实时字幕用 :speech 的火山引擎流式 ASR 识别音频
    implementation project(':speech')
    implementation libs.androidx.core.ktx
    implementation libs.kotlinx.coroutines.android
    // 火山引擎流式 ASR 的 WebSocket
    implementation libs.okhttp
    // 实时字幕的 PCM 音频源（ExoPlayerPcmAudioSource）
    implementation libs.androidx.media3.exoplayer
}
