plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: rootProject.file('gradle/android-library.gradle')

android {
    namespace = 'com.openapi.feature.video'
    buildFeatures {
        compose = true
        viewBinding = true
    }
}

dependencies {
    // 投屏的本地媒体服务（LocalMediaServer，原在 :core）
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // 工具类、GSY/IJK/Ali 播放内核（commonutil 以 api 暴露）
    api project(':commonutil')
    implementation project(':core')
    implementation project(':media')

    implementation libs.okhttp
    // Material 组件（BottomSheetDialog、Snackbar）
    implementation libs.google.material

    // Media3（PCM 音频源、ExoPlayer 数据源）
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.datasource
    implementation libs.androidx.media3.ui

    // Compose（LocalVideoActivity、VideoListItemCompose）
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.kotlinx.coroutines.android
}
