buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
        maven { url = "https://maven.aliyun.com/repository/public" }
    }
    
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath 'com.jakewharton:butterknife-gradle-plugin:10.2.3'
        // android-apt已弃用，使用annotationProcessor替代
        // classpath 'com.neenbedankt.gradle.plugins:android-apt:1.8'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.10"
        classpath "org.jetbrains.kotlin:kotlin-serialization:2.1.10"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.10"
        // 本地音乐模块（retromusic）：Room 的 KSP 代码生成 + Navigation safe-args
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.1.10-1.0.31"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.9.0"
    }
}

apply from: 'version.gradle'
apply from: 'dependencies.gradle'

allprojects {
    repositories {
        // 使用更现代的本地依赖方式
        flatDir { 
            dirs 'libs'
        }
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
        maven { url = "https://maven.aliyun.com/repository/public" }
    }
    
    // 统一依赖版本管理，解决版本冲突
    configurations.all {
        resolutionStrategy {
            // 强制使用统一的 androidx.annotation 版本
            force 'androidx.annotation:annotation:1.9.1'
            
            // 强制使用统一的 OkHttp 版本
            force 'com.squareup.okhttp3:okhttp:5.0.0'
            force 'com.squareup.okhttp3:logging-interceptor:5.0.0'
            force 'com.squareup.okhttp3:okhttp-android:5.0.0'
            
            // 强制使用统一的 AndroidX 核心库版本
            force 'androidx.core:core:1.17.0'
            force 'androidx.core:core-ktx:1.17.0'
            force 'androidx.appcompat:appcompat:1.7.1'
            force 'androidx.fragment:fragment:1.8.9'
            force 'androidx.activity:activity:1.11.0'
            force 'androidx.navigation:navigation-fragment-ktx:2.9.6'
            force 'androidx.navigation:navigation-ui-ktx:2.9.6'
            force 'androidx.navigation:navigation-compose:2.9.6'
            force 'androidx.recyclerview:recyclerview:1.4.0'
            force 'androidx.constraintlayout:constraintlayout:2.2.1'
            
            // 强制使用统一的 Lifecycle 版本
            force 'androidx.lifecycle:lifecycle-runtime:2.9.4'
            force 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
            force 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.4'
            force 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
            force 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
            
            // 强制使用统一的 Kotlin 版本
            force 'org.jetbrains.kotlin:kotlin-stdlib:2.1.10'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.10'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.10'
            force 'org.jetbrains.kotlin:kotlin-stdlib-common:2.1.10'
            force 'org.jetbrains.kotlin:kotlin-reflect:2.1.10'
            
            // 强制使用统一的 Kotlinx 协程版本
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2'
            
            // 强制使用统一的 Kotlinx 序列化版本（与 Kotlin 2.1 配套）
            force 'org.jetbrains.kotlinx:kotlinx-serialization-core:1.8.1'
            force 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
            force 'org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.8.1'
            force 'org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.8.1'

            // CameraX 1.4.2+：16KB 页对齐的 libimage_processing_util_jni.so
            def cam = rootProject.ext.cameraXVersion
            force "androidx.camera:camera-core:${cam}"
            force "androidx.camera:camera-camera2:${cam}"
            force "androidx.camera:camera-lifecycle:${cam}"
            force "androidx.camera:camera-view:${cam}"
        }
    }
    
    // 全局配置Java编译选项，禁用所有警告
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += [
            '-nowarn',               // 禁用所有警告
            '-Xlint:none',           // 禁用所有lint警告
            '-Xlint:-deprecation',   // 禁用废弃API警告
            '-Xlint:-unchecked',     // 禁用未检查转换警告
            '-Xlint:-rawtypes',      // 禁用原始类型警告
            '-Xlint:-varargs',       // 禁用可变参数警告
            '-Xlint:-cast',          // 禁用类型转换警告
            '-Xlint:-serial'         // 禁用序列化警告
        ]
        // 确保编译器不报告任何警告
        options.warnings = false
    }
    
    // 配置 Kotlin 编译选项
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
            freeCompilerArgs += [
                "-Xjvm-default=all",
                "-opt-in=kotlin.RequiresOptIn"
            ]
        }
    }
}
