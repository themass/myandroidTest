plugins {
    id 'com.android.library'
}

android {
    namespace 'com.openai.ads'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', '../proguard-common.pro'
            consumerProguardFiles "consumer-rules.pro"
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 项目模块依赖
    implementation project(":commonutil")

    // Google 广告
    api 'com.google.android.gms:play-services-ads:24.6.0'
    implementation 'com.google.android.gms:play-services-wallet:19.4.0'

    // Facebook 广告
    api 'com.facebook.android:audience-network-sdk:6.20.0'
    implementation 'com.facebook.infer.annotation:infer-annotation:0.18.0'
}