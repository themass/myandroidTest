plugins {
    id 'com.android.library'
}

apply from: rootProject.file('gradle/android-library.gradle')

android {
    namespace = 'com.openapi.ads'
}

dependencies {
    // 项目模块依赖
    implementation project(":common")
    // AdsEvents 用到的 flow 类型
    implementation libs.kotlinx.coroutines.android

    // Google 广告
    api 'com.google.android.gms:play-services-ads:24.9.0'
    implementation 'com.google.android.gms:play-services-wallet:19.5.0'
}