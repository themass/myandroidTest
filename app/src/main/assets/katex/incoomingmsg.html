<!-- 强制浏览器使用标准模式 -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 本地 KaTeX 资源 -->
    <link rel="stylesheet" href="file:///android_asset/katex/katex.min.css">
    <script defer src="file:///android_asset/katex/katex.min.js"></script>
    <script defer src="file:///android_asset/katex/auto-render.min.js"></script>

    <!-- 移动端优化 CSS -->
    <style>
        :root{--text-primary:#2d3748;--text-secondary:#4a5568;--bg-primary:#fff;--code-bg:#f7fafc;--border-color:#e2e8f0;--link-color:#3182ce;--formula-bg:#f8f9fa;--dark-text-primary:#e2e8f0;--dark-text-secondary:#cbd5e0;--dark-bg-primary:#1a202c;--dark-code-bg:#2d3748;--dark-border-color:#4a5568;--dark-link-color:#63b3ed;--dark-formula-bg:#2d3748}
        html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;margin:0!important;padding:0!important;height:100%}
        body{font-family:-apple-system,"Noto Sans SC",sans-serif;font-size:17px;line-height:1.6;color:var(--text-primary);background:var(--bg-primary);margin:0!important;padding:0 15px!important;min-height:100vh;box-sizing:border-box;display:flow-root}
        body>*:first-child{margin-top:0!important}
        body>*:last-child{margin-bottom:0!important}
        h1{font-size:1.6em;margin:0.9em 0 0.6em!important}
        h2{font-size:1.4em;margin:0.8em 0 0.5em!important}
        h3{font-size:1.2em;margin:0.7em 0 0.4em!important}
        .katex{font-size:1em!important;color:#555!important}
        .katex-display{font-size:1.1em!important;color:rgba(0,0,0,0.75)!important;background:var(--formula-bg);margin:1em 0!important;padding:1em!important;border-radius:6px;line-height:1.3!important;overflow-x:auto}
        @media (prefers-color-scheme: dark){.katex{color:#bbb!important}.katex-display{color:rgba(255,255,255,0.9)!important}body{-webkit-font-smoothing:subpixel-antialiased}}
        @media (max-width: 480px){body{font-size:16px;padding:0 12px!important;line-height:1.55}.katex{font-size:0.95em!important}.katex-display{font-size:1.05em!important;padding:0.8em!important;margin:0.9em 0!important}h1{font-size:1.45em!important}h2{font-size:1.3em!important}h3{font-size:1.15em!important}}
        p{color:var(--text-secondary)}
        pre{background:var(--code-bg)}
    </style>

    <!-- KaTeX 智能配置 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '\\[', right: '\\]', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false}
                ],
                macros: {
                    "\\text": "\\textrm{#1}",         // 中文直立文本
                    "\\frac": "\\dfrac{#1}{#2}",      // 增强分式显示
                    "\\abs": "\\left|#1\\right|",     // 绝对值宏
                    "\\R": "\\mathbb{R}",              // 实数集宏
                    "\\textcolor": "\\text{#1}{#2}",
                    "\\red": "\\textcolor{red}{#1}",
                    "\\blue": "\\textcolor{blue}{#1}"
                },
                output: 'html',
                throwOnError: false
            });
        });
    </script>
</head>
<body>
{{CONTENT}}
</body>
</html>
