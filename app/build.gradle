apply plugin: 'com.android.application'
//apply plugin: 'kotlin-android'
apply plugin: 'org.greenrobot.greendao'
//apply plugin: 'kotlin-android-extensions'
apply plugin: 'com.jakewharton.butterknife'
// gradle BuildVariants
//Build Variants = Product Flavor + Build Type
android {
    namespace "com.openapi.ks.free1"
    compileSdk 36
    ndkVersion "29.0.14033849"
    defaultConfig {
        applicationId "com.openapi.ks.free1"
        minSdk 28
        targetSdk 36
        versionCode 1001001031
        versionName "1.1.1.31"
        // Enabling multidex support.
        multiDexEnabled true
        flavorDimensions "versionCode"
        renderscriptTargetApi 18
        renderscriptSupportModeEnabled true

        // Play 64 位：仅保留 arm64-v8a，减小包体与内存占用
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.fork = true
        options.forkOptions.jvmArgs += [
                '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
                '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
                '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
//    kotlinOptions {
//        jvmTarget = "17"
//    }
    buildFeatures {
        viewBinding true
    }

    // AAB 按 ABI 拆分，用户只下载 arm64 包
    bundle {
        abi {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        language {
            enableSplit = true
        }
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
        abortOnError false
    }

    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/maven/com.squareup.okhttp/okhttp/pom.xml'
        exclude 'META-INF/maven/com.squareup.okhttp/okhttp/pom.properties'
        exclude 'META-INF/maven/com.squareup.okio/okio/pom.xml'
        exclude 'META-INF/maven/com.squareup.okio/okio/pom.properties'
        exclude 'META-INF/services/javax.annotation.processing.Processor'
    }
    sourceSets.main {
        jni.srcDirs = [] // disables the default ndk-build call (with on-the-fly Android.mk files)
//        jniLibs.srcDir 'src/main/jniLibs'
        jniLibs.srcDirs = ['libs']
    }
    signingConfigs {
        config {
            keyAlias 'themass'
            keyPassword 'themass'
            storeFile file('/Users/liguoqing/soft/myapp/key')
            storePassword 'themass'
        }
//        config {
//            keyAlias 'myapp'
//            keyPassword 'themass'
//            storeFile file('/home/web/local/mykey.jks')
//            storePassword 'themass'
//        }
    }
    buildTypes {
//        debug {
//            minifyEnabled false
//            debuggable true
//            zipAlignEnabled false // Zipalign优化
//            shrinkResources false
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//            signingConfig signingConfigs.config
//        }
        release {
            minifyEnabled true
            zipAlignEnabled true // Zipalign优化
            shrinkResources true // 移除无用的resource文件
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
            // 不上传完整 native 调试符号到 AAB（约省 15MB，提升 Play 优化评分）
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
    productFlavors {
        free {
            manifestPlaceholders = [CHANNEL_VALUE: "GOOGLEMARKET"]
        }
    }
}
greendao {
    schemaVersion 6
    daoPackage 'com.openapi.myapp.bean.form'
}
