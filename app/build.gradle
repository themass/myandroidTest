plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.greenrobot.greendao'
    id 'com.jakewharton.butterknife'
}

android {
    namespace = "com.openapi.ks.chat"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion = "23.1.7779620"
    
    defaultConfig {
        applicationId = "com.openapi.ks.chat"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 1001000060
        versionName = "1.1.0.60"
        multiDexEnabled = true
        flavorDimensions = ["versionCode"]
    }
    
    tasks.withType(JavaCompile).configureEach {
        options.fork = true
        options.incremental = true
        options.forkOptions.jvmArgs += [
            '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
        ]
        // 禁用编译警告
        options.compilerArgs += [
            '-nowarn',               // 禁用所有警告
            '-Xlint:none',           // 禁用所有lint警告
            '-Xlint:-deprecation',   // 禁用废弃API警告
            '-Xlint:-unchecked',     // 禁用未检查转换警告
            '-Xlint:-rawtypes',      // 禁用原始类型警告
            '-Xlint:-varargs',       // 禁用可变参数警告
            '-Xlint:-cast',          // 禁用类型转换警告
            '-Xlint:-serial'         // 禁用序列化警告
        ]
        // 确保编译器不报告任何警告
        options.warnings = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = "17"
    }
    
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    
    packagingOptions {
        exclude 'META-INF/LICENSE-LGPL-3.txt'
        exclude 'META-INF/LICENSE-LGPL-2.1.txt'
        exclude 'META-INF/LICENSE-W3C-TEST'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
    }
    
    // dexOptions已弃用，Android Gradle Plugin会自动优化dexing
    // dexOptions {
    //     preDexLibraries true
    //     javaMaxHeapSize "4g"
    // }
    
    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds = false
        abortOnError = false
        checkDependencies = true
        ignoreWarnings = true
        quiet = true
        // 抑制弃用警告
        disable 'deprecation'
        // 抑制未检查转换警告
        disable 'unchecked'
        // 抑制其他常见警告
        disable 'all'
    }

    sourceSets.main {
        jni.srcDirs = []
        jniLibs.srcDirs = ['libs']
    }

    signingConfigs {
        config {
            keyAlias 'themass'
            keyPassword 'themass'
            storeFile file('/Users/liguoqing/soft/myapp/key')
            storePassword 'themass'
        }
    }
    
    buildTypes {
        debug {
            minifyEnabled = false
            debuggable = true
            zipAlignEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', '../proguard-common.pro'
            signingConfig = signingConfigs.config
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', '../proguard-common.pro'
            signingConfig = signingConfigs.config
        }
    }
    
    productFlavors {
        chat {
            manifestPlaceholders = [CHANNEL_VALUE: "GOOGLEMARKET", AD_CHANNEL_VALUE: "GOOGLEMARKET"]
        }
    }
}
greendao {
    schemaVersion 8
}

dependencies {
    // 项目模块依赖
    implementation project(":commonutil")
    implementation project(":ads")
    implementation project(":messagekit")
    implementation project(':livekitvoice')
    
    // 本地库文件
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    // AndroidX 核心库
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.6'
    implementation 'androidx.percentlayout:percentlayout:1.0.0'
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // 现代UI组件替代
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.github.donkingliang:LabelsView:1.6.5'
    implementation 'com.skyfishjy.ripplebackground:library:1.0.1'
    
    // 现代图片查看器替代 ImageGallery
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    // 依赖注入
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    implementation 'com.jakewharton:butterknife:10.2.3'

    // 视频播放（GSY 已含 Exo；Media3 供其他模块或后续扩展）
    implementation 'androidx.media3:media3-exoplayer:1.10.0'
    implementation 'androidx.media3:media3-datasource:1.10.0'
    implementation 'androidx.media3:media3-ui:1.10.0'

    // 投屏：Google Cast（小米电视 Android TV / Chromecast 等；需设备与手机同局域网且支持 Cast）
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'

    // 响应式编程
    implementation 'io.reactivex.rxjava3:rxjava:3.1.11'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'

    // 数据库
    implementation 'org.greenrobot:greendao:3.3.0'

    // Markdown解析库
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:image-glide:4.6.2'
    implementation 'io.noties.markwon:ext-latex:4.6.2'
    implementation 'io.noties.markwon:image:4.6.2'
    implementation 'io.noties.markwon:html:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'

    // 富文本和图像处理
    implementation 'com.caverock:androidsvg:1.4'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.29'

    // FlexMark：InputMsgWebView + KaTeX 模板中 Markdown → HTML（与 Markwon 并行，公式密集消息走 WebView）
    implementation 'com.vladsch.flexmark:flexmark:0.64.8'
    implementation 'com.vladsch.flexmark:flexmark-ext-gfm-strikethrough:0.64.8'
    implementation 'com.vladsch.flexmark:flexmark-ext-tables:0.64.8'
    implementation 'com.vladsch.flexmark:flexmark-ext-autolink:0.64.8'
}
