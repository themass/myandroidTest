plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = "com.openapi.app"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion = "27.0.12077973"

    // 拍照解题的答案识别依赖 arm64-v8a 原生库（MNN + libdococr），CMake 只为 arm64 构建
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    
    defaultConfig {
        applicationId = "com.openapi.ks.chat"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 1001000066
        versionName = "1.1.0.66"
        multiDexEnabled = true
        flavorDimensions = ["versionCode"]

        ndk {
            abiFilters(*rootProject.ext.playAbiFilters)
        }
    }
    
    tasks.withType(JavaCompile).configureEach {
        options.fork = true
        options.incremental = true
        options.forkOptions.jvmArgs += [
            '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
        ]
        // 禁用编译警告
        options.compilerArgs += [
            '-nowarn',               // 禁用所有警告
            '-Xlint:none',           // 禁用所有lint警告
            '-Xlint:-deprecation',   // 禁用废弃API警告
            '-Xlint:-unchecked',     // 禁用未检查转换警告
            '-Xlint:-rawtypes',      // 禁用原始类型警告
            '-Xlint:-varargs',       // 禁用可变参数警告
            '-Xlint:-cast',          // 禁用类型转换警告
            '-Xlint:-serial'         // 禁用序列化警告
        ]
        // 确保编译器不报告任何警告
        options.warnings = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = "17"
    }
    
    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose = true
    }

    // 拍照解题服务地址（myconf/python/ocr 的 photosolve 接口）：在 gradle.properties 里设置 photosolveBaseUrl；
    // 不设置则拍照解题仍使用 mock。
    defaultConfig {
        buildConfigField "String", "PHOTOSOLVE_BASE_URL", "\"${project.findProperty('photosolveBaseUrl') ?: ''}\""
    }

    testOptions {
        unitTests {
            // Robolectric 需要合并后的真实布局/清单，才能在 JVM 上启动页面做冒烟测试
            includeAndroidResources = true
            all {
                // JDK 17+ 下 Robolectric 要反射进 java.base，否则 AndroidInterceptors 报 IllegalAccessException
                it.jvmArgs(
                    '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                )
            }
        }
    }

    packagingOptions {
        exclude 'META-INF/LICENSE-LGPL-3.txt'
        exclude 'META-INF/LICENSE-LGPL-2.1.txt'
        exclude 'META-INF/LICENSE-W3C-TEST'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
        // 依赖可能带入已废弃的 armeabi，打包时剔除
        exclude 'lib/armeabi/**'
    }

    // Google Play 推荐 AAB：按 ABI/密度/语言拆分，用户只下载对应架构（含 64 位 arm64-v8a）
    bundle {
        abi {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        language {
            enableSplit = true
        }
    }
    
    // dexOptions已弃用，Android Gradle Plugin会自动优化dexing
    // dexOptions {
    //     preDexLibraries true
    //     javaMaxHeapSize "4g"
    // }
    
    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds = false
        abortOnError = false
        checkDependencies = true
        ignoreWarnings = true
        quiet = true
        // 抑制弃用警告
        disable 'deprecation'
        // 抑制未检查转换警告
        disable 'unchecked'
        // 抑制其他常见警告
        disable 'all'
    }

    sourceSets.main {
        jni.srcDirs = []
        jniLibs.srcDirs = ['libs', 'src/main/jniLibs']
    }

    def appKeystore = file('/Users/liguoqing/soft/myapp/key')

    signingConfigs {
        config {
            keyAlias 'themass'
            keyPassword 'themass'
            storeFile appKeystore
            storePassword 'themass'
        }
    }

    buildTypes {
        debug {
            minifyEnabled = false
            debuggable = true
            zipAlignEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', '../proguard-common.pro'
            // 本机没有正式 key 时回退到 Android 默认 debug key；用哪把 key 签名会影响覆盖安装
            if (appKeystore.exists()) {
                signingConfig = signingConfigs.config
            }
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', '../proguard-common.pro'
            signingConfig = signingConfigs.config
        }
    }
    
    productFlavors {
        chat {
            manifestPlaceholders = [CHANNEL_VALUE: "GOOGLEMARKET", AD_CHANNEL_VALUE: "GOOGLEMARKET"]
        }
    }
}
dependencies {
    implementation libs.kotlinx.coroutines.android
    implementation libs.okhttp
    testImplementation 'junit:junit:4.13.2'
    // Room DAO 的 JVM 测试：Robolectric 提供真实的 SQLite，不用设备
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation libs.kotlinx.coroutines.test

    // 组合根：所有 feature 和它们需要在 Application 里初始化的模块
    implementation project(":common")
    testImplementation project(':imaging')
    implementation project(':speech')
    implementation project(':core')
    implementation project(':feature-video')
    implementation project(':feature-chat')
    implementation project(':feature-photosolve')
    implementation project(':feature-user')
    implementation project(':feature-content')
    implementation project(':feature-companion')
    implementation project(':retromusic')
    implementation project(':chatkit')

    // MyApplication 继承 MultiDexApplication
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation libs.google.material
    implementation libs.androidx.fragment
    implementation libs.androidx.activity
    // 启动页的雷达扫描动画（MyRadarScanView）
    implementation 'com.skyfishjy.ripplebackground:library:1.0.1'
    // 播放引擎偏好（PlaybackEngineHelper 的 @UnstableApi）、首页的语音播放
    implementation libs.androidx.media3.exoplayer
    // Glide：应用唯一的 AppGlideModule（AppGlideConfig）在本模块，由 Glide 注解处理器生成实现
    implementation libs.glide
    annotationProcessor libs.glide.compiler

    // 首页框架（Compose）
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    debugImplementation libs.androidx.compose.ui.tooling
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
}
