apply plugin: 'com.android.application'
// Kotlin + Compose（见根 build.gradle 的 classpath）
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.greenrobot.greendao'
//apply plugin: 'kotlin-android-extensions'
// gradle BuildVariants
//Build Variants = Product Flavor + Build Type
android {
    namespace "com.openapi.ks.free1"
    compileSdk 37
    ndkVersion "27.0.12077973"
    defaultConfig {
        applicationId "com.openapi.ks.free1"
        minSdk 28
        targetSdk 37
        // 大版本升级：2.0.0。versionCode 采用 major*10000+minor*100+patch = 20000
        //
        // ⚠️ versionName 必须是 4 段数字（X.X.X.X），不能是 3 段。
        // 后端 DeviceUtil.java 用正则 "VVV/([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)"
        // 解析 User-Agent 里的版本号，写死要求 4 段；三段版本号（如 "2.0.0"）匹配
        // 不上，会导致 DeviceUtil.getAPPInfo() 返回 null，进而所有接口（包括登录）
        // 直接抛 RuntimeException("welcome")——这不是网络请求 header 或加密的问题，
        // 是版本号格式和后端正则不匹配。2026-11-02 真机测试时踩到过，别再改回三段式。
        versionCode 20004
        versionName "2.0.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        flavorDimensions "versionCode"

        // Play 64 位：仅保留 arm64-v8a，减小包体与内存占用
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.fork = true
        options.forkOptions.jvmArgs += [
                '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
                '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
                '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
//    kotlinOptions {
//        jvmTarget = "17"
//    }
    buildFeatures {
        viewBinding true
        compose true
    }

    // AAB 按 ABI 拆分，用户只下载 arm64 包
    bundle {
        abi {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        language {
            enableSplit = true
        }
    }

    lint {
        disable 'InvalidPackage', 'ExpiredTargetSdkVersion'
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/DEPENDENCIES', 'META-INF/*.kotlin_module']
        }
        jniLibs {
            useLegacyPackaging = false
        }
    }
    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/maven/com.squareup.okhttp/okhttp/pom.xml'
        exclude 'META-INF/maven/com.squareup.okhttp/okhttp/pom.properties'
        exclude 'META-INF/maven/com.squareup.okio/okio/pom.xml'
        exclude 'META-INF/maven/com.squareup.okio/okio/pom.properties'
        exclude 'META-INF/services/javax.annotation.processing.Processor'
    }
    sourceSets.main {
        jni.srcDirs = [] // disables the default ndk-build call (with on-the-fly Android.mk files)
//        jniLibs.srcDir 'src/main/jniLibs'
        jniLibs.srcDirs = ['libs']
    }
    def keystorePropsFile = rootProject.file('keystore.properties')
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
//        debug {
//            minifyEnabled false
//            debuggable true
//            zipAlignEnabled false // Zipalign优化
//            shrinkResources false
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//            signingConfig keystorePropsFile.exists() ? signingConfigs.release : null
//        }
        release {
            minifyEnabled true
            zipAlignEnabled true // Zipalign优化
            shrinkResources true // 移除无用的resource文件
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : null
            // 不上传完整 native 调试符号到 AAB（约省 15MB，提升 Play 优化评分）
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
    productFlavors {
        free {
            manifestPlaceholders = [CHANNEL_VALUE: "GOOGLEMARKET"]
        }
    }
}
// Kotlin 与 Java 统一为 JVM 17（Kotlin 默认按工具链 21 编译，会与 Java 的 17 冲突）
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
greendao {
    schemaVersion 8  // v8 新增 ConnSession 会话表（连接时长与流量统计）；ConnLog 结构不变
    daoPackage 'com.openapi.myapp.bean.form'
}
dependencies {

    // sing-box（libbox）承载 VLESS+Reality 与用户自己的分享链接节点。
    // 本地从源码构建（SagerNet/sing-box v1.13.5，build_libbox），
    // 没有 Maven 发布，走 fileTree 直接引入 .aar。
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation fileTree(dir: 'libs', include: ['*.jar'])

//    implementation 'cn.jzvd:jiaozivideoplayer:6.2.12'
//    implementation(name: 'glide-transformations-2.0.1', ext: 'aar',)
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.fragment:fragment:1.9.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.9.4"
    implementation "androidx.lifecycle:lifecycle-livedata:2.9.4"
    implementation "androidx.cardview:cardview:1.0.0"
//material 版本不能动，会影响kotlin版本
    implementation 'com.google.android.material:material:1.14.0'
    // Compose：ProtonVPN 风格界面（与 XML 界面共存，设置里切换）
    implementation platform('androidx.compose:compose-bom:2025.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.11.0'
    annotationProcessor 'androidx.annotation:annotation:1.11.0'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.9'
    implementation 'com.github.bumptech.glide:okhttp3-integration:5.0.9'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'

    implementation 'com.squareup.okhttp3:logging-interceptor:5.5.1'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'

    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.15.0'
    // 二维码生成（Apache-2.0，只做编码，不需要相机权限）
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.github.jenly1314:RadarView:1.0.2'
    // 波纹扩散动画（MIT，Maven Central）。与上面的 RadarView 并存，设置页可切换。
    implementation 'pl.bclogic:pulsator4droid:1.0.3'
    // WebViewAssetLoader：3D 地球页面通过同源 https 路径加载离线资源
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'me.weyye.hipermission:library:1.0.7'


    implementation 'com.jakewharton:disklrucache:2.0.2'
//    implementation 'com.github.JakeWharton:ViewPagerIndicator:2.4.1'

    // If you want to use the GPU Filters
//    implementation 'jp.co.cyberagent.android.gpuimage:gpuimage-library:1.4.1'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'org.greenrobot:greendao:3.3.0'

    implementation 'com.romainpiel.shimmer:library:1.4.0@aar'

    implementation 'com.github.lawloretienne:imagegallery:0.1.0'
    implementation 'com.sothree.slidinguppanel:library:3.4.0'

    implementation 'com.google.android.gms:play-services-ads:25.5.0'

    // WireGuard 官方用户态实现（Apache-2.0，与 GPL-2.0 兼容）。
    // AAR 内含 4 个 ABI 的 libwg-go.so；由 abiFilters 'arm64-v8a' 统一裁剪包体。
    implementation 'com.wireguard.android:tunnel:1.0.20260102'

    // 原生层提案格式校验测试（需真机/模拟器运行）
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
//    implementation 'com.google.android.gms:play-services-base:18.2.0'
//    implementation 'com.google.android.gms:play-services-location:21.0.1'
//    implementation 'com.google.android.gms:play-services-wallet:19.1.0'

//    implementation 'com.mbridge.msdk.oversea:reward:16.4.31'
////如果您需要使用竞价广告,请添加此条依赖语句。(mbbid)
//    implementation 'com.mbridge.msdk.oversea:mbbid:16.4.31'
//    implementation 'com.mbridge.msdk.oversea:mbsplash:16.4.31'
//    implementation 'com.mbridge.msdk.oversea:mbbanner:16.4.31'
//    implementation 'com.mbridge.msdk.oversea:newinterstitial:16.4.31'
//    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
//    implementation 'androidx.core:core-ktx:1.0.2'

}