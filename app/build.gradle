plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.jakewharton.butterknife'
}

android {
    namespace = "com.openapi.ks.chat"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion = "27.0.12077973"

    // 拍照解题的答案识别依赖 arm64-v8a 原生库（MNN + libdococr），CMake 只为 arm64 构建
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    
    defaultConfig {
        applicationId = "com.openapi.ks.chat"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 1001000066
        versionName = "1.1.0.66"
        multiDexEnabled = true
        flavorDimensions = ["versionCode"]

        ndk {
            abiFilters(*rootProject.ext.playAbiFilters)
        }
    }
    
    tasks.withType(JavaCompile).configureEach {
        options.fork = true
        options.incremental = true
        options.forkOptions.jvmArgs += [
            '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
        ]
        // 禁用编译警告
        options.compilerArgs += [
            '-nowarn',               // 禁用所有警告
            '-Xlint:none',           // 禁用所有lint警告
            '-Xlint:-deprecation',   // 禁用废弃API警告
            '-Xlint:-unchecked',     // 禁用未检查转换警告
            '-Xlint:-rawtypes',      // 禁用原始类型警告
            '-Xlint:-varargs',       // 禁用可变参数警告
            '-Xlint:-cast',          // 禁用类型转换警告
            '-Xlint:-serial'         // 禁用序列化警告
        ]
        // 确保编译器不报告任何警告
        options.warnings = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = "17"
    }
    
    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose = true
    }
    
    packagingOptions {
        exclude 'META-INF/LICENSE-LGPL-3.txt'
        exclude 'META-INF/LICENSE-LGPL-2.1.txt'
        exclude 'META-INF/LICENSE-W3C-TEST'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
        // 依赖可能带入已废弃的 armeabi，打包时剔除
        exclude 'lib/armeabi/**'
    }

    // Google Play 推荐 AAB：按 ABI/密度/语言拆分，用户只下载对应架构（含 64 位 arm64-v8a）
    bundle {
        abi {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        language {
            enableSplit = true
        }
    }
    
    // dexOptions已弃用，Android Gradle Plugin会自动优化dexing
    // dexOptions {
    //     preDexLibraries true
    //     javaMaxHeapSize "4g"
    // }
    
    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds = false
        abortOnError = false
        checkDependencies = true
        ignoreWarnings = true
        quiet = true
        // 抑制弃用警告
        disable 'deprecation'
        // 抑制未检查转换警告
        disable 'unchecked'
        // 抑制其他常见警告
        disable 'all'
    }

    sourceSets.main {
        jni.srcDirs = []
        jniLibs.srcDirs = ['libs', 'src/main/jniLibs']
    }

    def appKeystore = file('/Users/liguoqing/soft/myapp/key')

    signingConfigs {
        config {
            keyAlias 'themass'
            keyPassword 'themass'
            storeFile appKeystore
            storePassword 'themass'
        }
    }

    buildTypes {
        debug {
            minifyEnabled = false
            debuggable = true
            zipAlignEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', '../proguard-common.pro'
            // 本机没有正式 key 时回退到 Android 默认 debug key；用哪把 key 签名会影响覆盖安装
            if (appKeystore.exists()) {
                signingConfig = signingConfigs.config
            }
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', '../proguard-common.pro'
            signingConfig = signingConfigs.config
        }
    }
    
    productFlavors {
        chat {
            manifestPlaceholders = [CHANNEL_VALUE: "GOOGLEMARKET", AD_CHANNEL_VALUE: "GOOGLEMARKET"]
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Room DAO 的 JVM 测试：Robolectric 提供真实的 SQLite，不用设备
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.7.0'
    // 项目模块依赖
    implementation project(":commonutil")
    implementation project(":ads")
    implementation project(":messagekit")
    implementation project(':auxio_music_ui')
    implementation project(':retromusic')
    
    // 本地库文件
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    // AndroidX 核心库
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.6'
    implementation 'androidx.percentlayout:percentlayout:1.0.0'
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // 现代UI组件替代
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.github.donkingliang:LabelsView:1.6.5'
    implementation 'com.skyfishjy.ripplebackground:library:1.0.1'
    
    // 现代图片查看器替代 ImageGallery
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    // 依赖注入
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    implementation 'com.jakewharton:butterknife:10.2.3'

    // 视频播放（GSY 已含 Exo；Media3 供其他模块或后续扩展）
    implementation 'androidx.media3:media3-exoplayer:1.10.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.10.0'
    implementation 'androidx.media3:media3-datasource:1.10.0'
    implementation 'androidx.media3:media3-ui:1.10.0'

    // 投屏：Google Cast（小米电视 Android TV / Chromecast 等；需设备与手机同局域网且支持 Cast）
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'

    // 响应式编程
    implementation 'io.reactivex.rxjava3:rxjava:3.1.11'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'

    // 数据库（Room；实体和 DAO 是 Java，用 annotationProcessor 生成实现）
    implementation 'androidx.room:room-runtime:2.7.1'
    annotationProcessor 'androidx.room:room-compiler:2.7.1'

    // Markdown解析库
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:image-glide:4.6.2'
    implementation 'io.noties.markwon:ext-latex:4.6.2'
    implementation 'io.noties.markwon:image:4.6.2'
    implementation 'io.noties.markwon:html:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:linkify:4.6.2'

    // 富文本和图像处理
    implementation 'com.caverock:androidsvg:1.4'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.29'

    // FlexMark：InputMsgWebView + KaTeX 模板中 Markdown → HTML（与 Markwon 并行，公式密集消息走 WebView）
    implementation 'com.vladsch.flexmark:flexmark:0.64.8'
    implementation 'com.vladsch.flexmark:flexmark-ext-gfm-strikethrough:0.64.8'
    implementation 'com.vladsch.flexmark:flexmark-ext-tables:0.64.8'
    implementation 'com.vladsch.flexmark:flexmark-ext-autolink:0.64.8'

    // ---------- 拍照解题（移植自 ai-math/paizhao） ----------
    def composeBom = platform('androidx.compose:compose-bom:2025.03.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    // 相机预览与拍照
    implementation 'androidx.camera:camera-core:1.4.0'
    implementation 'androidx.camera:camera-camera2:1.4.0'
    implementation 'androidx.camera:camera-lifecycle:1.4.0'
    implementation 'androidx.camera:camera-view:1.4.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.guava:listenablefuture:1.0'

    // 裁剪 UI / 文档边缘检测 / 存储访问
    implementation 'io.github.mr0xf00:easycrop:0.1.1'
    implementation 'org.opencv:opencv:4.10.0'
    implementation 'com.anggrayudi:storage:1.5.6'

    // DLNA 投屏：本地文件的 HTTP 分发（LocalMediaServer）
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Google 智能文档扫描
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'

    // 文档检测推理（DocQuadNet 等 ONNX 模型）
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.1'
}
