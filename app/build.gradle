apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.greenrobot.greendao'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.jakewharton.butterknife'


// gradle BuildVariants
//Build Variants = Product Flavor + Build Type
android {
    namespace "com.openapi.ks.chat"
    compileSdk 36
//    buildTools "29.0.2"
    ndkVersion "27.0.12077973"
    defaultConfig {
        applicationId "com.openapi.ks.chat"
        minSdk 28
        targetSdk 35
        versionCode 1001000022
        versionName "1.1.0.22"
        // Enabling multidex support.
        multiDexEnabled true
        flavorDimensions "versionCode"
        renderscriptTargetApi 18
        renderscriptSupportModeEnabled true

        // 拍照解题模块的答案识别依赖 arm64-v8a 原生库
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags += ""
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    tasks.withType(JavaCompile).configureEach{
        options.fork = true
        options.forkOptions.jvmArgs +=[
                '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
                '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
                '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }
    dexOptions {
//        incremental true
        preDexLibraries true
        javaMaxHeapSize "4g"
    }
    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
        abortOnError false
    }


    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/maven/com.squareup.okhttp/okhttp/pom.xml'
        exclude 'META-INF/maven/com.squareup.okhttp/okhttp/pom.properties'
        exclude 'META-INF/maven/com.squareup.okio/okio/pom.xml'
        exclude 'META-INF/maven/com.squareup.okio/okio/pom.properties'
        exclude 'META-INF/services/javax.annotation.processing.Processor'
    }
    sourceSets.main {
        jni.srcDirs = [] // disables the default ndk-build call (with on-the-fly Android.mk files)
//        jniLibs.srcDir 'src/main/jniLibs'
        jniLibs.srcDirs = ['libs']
        // greenDAO 生成目录（targetGenDir 指向 build/ 时不会自动加入 Java 源集）
        java.srcDirs += ['build/generated/greendao']
    }
    signingConfigs {
        // 原作者本机签名文件路径在其它机器上不存在，缺失时回退到仓库内的调试签名，
        // 让任何机器都能直接构建；有原始密钥时行为不变。
        config {
            keyAlias 'themass'
            keyPassword 'themass'
            def originalStore = file('/Users/liguoqing/soft/myapp/key')
            def fallbackStore = rootProject.file('keystore/debug.jks')
            storeFile originalStore.exists() ? originalStore : (fallbackStore.exists() ? fallbackStore : null)
            storePassword 'themass'
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            zipAlignEnabled false // Zipalign优化
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
        release {
            minifyEnabled true
            debuggable false
            zipAlignEnabled true // Zipalign优化
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }
    productFlavors {
        chat {
            manifestPlaceholders = [CHANNEL_VALUE: "GOOGLEMARKET", AD_CHANNEL_VALUE: "GOOGLEMARKET"]
        }
    }
//    tasks.named('compileDebugKotlin') {
//        dependsOn(':app:greendao')
//    }
}
greendao {
    schemaVersion 6
    // 生成类的包名与源码里的 import 保持一致；生成到 build/ 目录，不再写回 src/main/java，
    // 避免构建过程改动被 git 跟踪的源码。
    daoPackage 'com.ping.greendao.gen'
    targetGenDir 'build/generated/greendao'
}

// 生成目录被加入 Java 源集后，必须让编译任务显式依赖 greenDAO 的代码生成，
// 否则 Gradle 无法确定两者的先后顺序（Gradle 8 会直接判定构建配置有误）。
tasks.withType(JavaCompile).configureEach { dependsOn 'greendao' }
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { dependsOn 'greendao' }
configurations {
    implementation.exclude module: 'gson' //Remove duplicate dependencies： gson
}
dependencies {

    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    //不能升级，会影响kotlin版本
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.legacy:legacy-support-v13:1.0.0"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation "androidx.palette:palette:1.0.0"
    implementation "androidx.recyclerview:recyclerview"
    implementation "androidx.cardview:cardview"
    //material 版本不能动，会影响kotlin版本
    implementation 'com.google.android.material:material:1.4.0'
    annotationProcessor 'androidx.annotation:annotation:1.8.0'
    implementation "androidx.percentlayout:percentlayout:1.0.0"
    implementation 'androidx.multidex:multidex:2.0.1'
//    implementation 'androidx.multidex:multidex:2.0.1'
    //不能升级，影响kotlin版本
    implementation 'com.google.android.gms:play-services-ads:22.0.0'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'

    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.15.1'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'

    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'


    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    implementation 'com.jakewharton:butterknife:10.2.3'
    implementation 'com.jakewharton:disklrucache:2.0.2'
//    implementation 'com.github.JakeWharton:ViewPagerIndicator:2.4.1'

    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'com.github.lawloretienne:imagegallery:0.1.0'
    implementation 'com.romainpiel.shimmer:library:1.4.0@aar'
    implementation 'com.sothree.slidinguppanel:library:3.3.1'

    implementation 'jp.co.cyberagent.android.gpuimage:gpuimage-library:1.4.1'
    implementation 'org.greenrobot:eventbus:3.0.0'
    implementation 'org.greenrobot:greendao:3.3.0'

    implementation 'com.nightonke:boommenu:2.1.1'


    implementation 'cn.jzvd:jiaozivideoplayer:7.7.0'
    //和 gsy 冲突了，不能升级版本，不兼容
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'

    implementation 'io.reactivex:rxjava:1.1.9'
    implementation 'io.reactivex:rxandroid:1.2.1'

    implementation 'com.github.CarGuo.GSYVideoPlayer:GSYVideoPlayer:v8.6.0-release-jitpack'
    //是否需要AliPlayer模式
//    implementation 'com.github.CarGuo.GSYVideoPlayer:GSYVideoPlayer-aliplay:v8.4.0-release-jitpack'

    // 对话框，chat（原坐标 tz.co.hosannahighertech:messagekit:1.0.0apha4 已从公共仓库下架，
    // 现以本地模块 messagekit/ 内置，包名与之前保持一致）
    implementation project(':messagekit')
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.github.siyamed:android-shape-imageview:0.9.3'

    //Utils
//    implementation "me.relex:circleindicator:2.1.4"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.0.2'

    //工具集
    //Gson
    implementation 'com.google.code.gson:gson:2.10.1'
// 输入框，语音+图片
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.30'
    // PictureSelector basic (Necessary)
    implementation 'io.github.lucksiege:pictureselector:v3.11.2'
    // image compress library (Not necessary)
    implementation 'io.github.lucksiege:compress:v3.11.2'
    // uCrop library (Not necessary)
    implementation 'io.github.lucksiege:ucrop:v3.11.2'
    // simple camerax library (Not necessary)
    implementation 'io.github.lucksiege:camerax:v3.11.2'
//asr 识别
//    implementation group: 'com.alphacephei', name: 'vosk-android', version: '0.3.32+'
//    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
//    implementation 'net.java.dev.jna:jna:5.13.0@aar'
//asr bytedance
    implementation 'com.bytedance.speechengine:speechengine_tob:0.0.3'
    implementation 'pub.devrel:easypermissions:3.0.0'

    // ---------- 拍照解题（移植自 ai-math/paizhao） ----------
    def composeBom = platform('androidx.compose:compose-bom:2025.03.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    // 相机预览与拍照
    implementation 'androidx.camera:camera-core:1.4.0'
    implementation 'androidx.camera:camera-camera2:1.4.0'
    implementation 'androidx.camera:camera-lifecycle:1.4.0'
    implementation 'androidx.camera:camera-view:1.4.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.guava:listenablefuture:1.0'

    // 裁剪 UI / 文档边缘检测 / 文件选择
    implementation 'io.github.mr0xf00:easycrop:0.1.1'
    implementation 'org.opencv:opencv:4.10.0'
    implementation 'com.anggrayudi:storage:1.5.6'

    // Google 智能扫描（整流程截图裁剪）
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'

    // 公司算法：MNN 文档检测（arm64-v8a，权重运行时放置）
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.1'

}
