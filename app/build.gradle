plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = "com.openapi.ks.chat"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion = "27.0.12077973"

    // 拍照解题的答案识别依赖 arm64-v8a 原生库（MNN + libdococr），CMake 只为 arm64 构建
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    
    defaultConfig {
        applicationId = "com.openapi.ks.chat"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 1001000066
        versionName = "1.1.0.66"
        multiDexEnabled = true
        flavorDimensions = ["versionCode"]

        ndk {
            abiFilters(*rootProject.ext.playAbiFilters)
        }
    }
    
    tasks.withType(JavaCompile).configureEach {
        options.fork = true
        options.incremental = true
        options.forkOptions.jvmArgs += [
            '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
        ]
        // 禁用编译警告
        options.compilerArgs += [
            '-nowarn',               // 禁用所有警告
            '-Xlint:none',           // 禁用所有lint警告
            '-Xlint:-deprecation',   // 禁用废弃API警告
            '-Xlint:-unchecked',     // 禁用未检查转换警告
            '-Xlint:-rawtypes',      // 禁用原始类型警告
            '-Xlint:-varargs',       // 禁用可变参数警告
            '-Xlint:-cast',          // 禁用类型转换警告
            '-Xlint:-serial'         // 禁用序列化警告
        ]
        // 确保编译器不报告任何警告
        options.warnings = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = "17"
    }
    
    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose = true
    }

    // 拍照解题服务地址（myconf/python/ocr 的 photosolve 接口）：在 gradle.properties 里设置 photosolveBaseUrl；
    // 不设置则拍照解题仍使用 mock。
    defaultConfig {
        buildConfigField "String", "PHOTOSOLVE_BASE_URL", "\"${project.findProperty('photosolveBaseUrl') ?: ''}\""
    }

    testOptions {
        unitTests {
            // Robolectric 需要合并后的真实布局/清单，才能在 JVM 上启动页面做冒烟测试
            includeAndroidResources = true
            all {
                // JDK 17+ 下 Robolectric 要反射进 java.base，否则 AndroidInterceptors 报 IllegalAccessException
                it.jvmArgs(
                    '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                )
            }
        }
    }

    packagingOptions {
        exclude 'META-INF/LICENSE-LGPL-3.txt'
        exclude 'META-INF/LICENSE-LGPL-2.1.txt'
        exclude 'META-INF/LICENSE-W3C-TEST'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
        // 依赖可能带入已废弃的 armeabi，打包时剔除
        exclude 'lib/armeabi/**'
    }

    // Google Play 推荐 AAB：按 ABI/密度/语言拆分，用户只下载对应架构（含 64 位 arm64-v8a）
    bundle {
        abi {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        language {
            enableSplit = true
        }
    }
    
    // dexOptions已弃用，Android Gradle Plugin会自动优化dexing
    // dexOptions {
    //     preDexLibraries true
    //     javaMaxHeapSize "4g"
    // }
    
    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds = false
        abortOnError = false
        checkDependencies = true
        ignoreWarnings = true
        quiet = true
        // 抑制弃用警告
        disable 'deprecation'
        // 抑制未检查转换警告
        disable 'unchecked'
        // 抑制其他常见警告
        disable 'all'
    }

    sourceSets.main {
        jni.srcDirs = []
        jniLibs.srcDirs = ['libs', 'src/main/jniLibs']
    }

    def appKeystore = file('/Users/liguoqing/soft/myapp/key')

    signingConfigs {
        config {
            keyAlias 'themass'
            keyPassword 'themass'
            storeFile appKeystore
            storePassword 'themass'
        }
    }

    buildTypes {
        debug {
            minifyEnabled = false
            debuggable = true
            zipAlignEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', '../proguard-common.pro'
            // 本机没有正式 key 时回退到 Android 默认 debug key；用哪把 key 签名会影响覆盖安装
            if (appKeystore.exists()) {
                signingConfig = signingConfigs.config
            }
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', '../proguard-common.pro'
            signingConfig = signingConfigs.config
        }
    }
    
    productFlavors {
        chat {
            manifestPlaceholders = [CHANNEL_VALUE: "GOOGLEMARKET", AD_CHANNEL_VALUE: "GOOGLEMARKET"]
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Room DAO 的 JVM 测试：Robolectric 提供真实的 SQLite，不用设备
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation libs.kotlinx.coroutines.test
    // 项目模块依赖
    implementation project(":commonutil")
    implementation project(':core')
    // 启动页的雷达扫描动画（MyRadarScanView）
    implementation 'com.skyfishjy.ripplebackground:library:1.0.1'
    // 火山引擎流式 ASR：聊天（ChatViewModel）与视频字幕共用，不依赖 :feature-video
    implementation project(':media')
    implementation project(':feature-video')
    implementation project(':feature-roles')
    implementation project(':feature-chat')
    implementation project(':feature-photosolve')
    implementation project(':feature-user')
    implementation project(':feature-content')
    implementation project(':feature-companion')
    implementation project(":ads")
    implementation project(':retromusic')
    // 对话 UI 组件库：消息列表、消息气泡、输入栏
    implementation project(':chatkit')
    
    // 本地库文件
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    // AndroidX 核心库
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation libs.google.material
    
    // 现代UI组件替代
    implementation libs.androidx.fragment
    implementation libs.androidx.activity
    implementation 'com.github.donkingliang:LabelsView:1.6.5'
    
    // 现代图片查看器替代 ImageGallery


    // 视频播放（GSY 已含 Exo；Media3 供其他模块或后续扩展）
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.exoplayer.hls
    implementation libs.androidx.media3.datasource
    implementation libs.androidx.media3.ui

    // 投屏：Google Cast（小米电视 Android TV / Chromecast 等；需设备与手机同局域网且支持 Cast）
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'

    // 响应式编程

    // 数据库（Room；实体和 DAO 是 Java，用 annotationProcessor 生成实现）
    implementation libs.androidx.room.runtime
    annotationProcessor libs.androidx.room.compiler

    // Markdown解析库

    // 富文本和图像处理

    // FlexMark：InputMsgWebView + KaTeX 模板中 Markdown → HTML（与 Markwon 并行，公式密集消息走 WebView）

    // ---------- 拍照解题（移植自 ai-math/paizhao） ----------
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    debugImplementation libs.androidx.compose.ui.tooling
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    // LiveKit 房间连接：陪伴的文字与主动消息都走这条通道（见 companion/LiveKitCompanionTransport.kt）。
    implementation libs.androidx.lifecycle.runtime.compose

    // 相机预览与拍照

    // 裁剪 UI / 文档边缘检测 / 存储访问
    // 4.12.0 起 libopencv_java4.so 为 16KB 对齐（Play 要求）；4.10.0 为 4KB 对齐

    // DLNA 投屏：本地文件的 HTTP 分发（LocalMediaServer）

    // Google 智能文档扫描
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'

    // 文档检测推理（DocQuadNet 等 ONNX 模型）
}
