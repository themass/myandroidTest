plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// :network：HTTP 收发、请求封装、DNS、Glide 的网络加载组件。
// 不认识业务：接口域名、请求头名、登录失效处理由应用启动时通过 NetConfig 注入。
apply from: rootProject.file('gradle/android-library.gradle')

android {
    namespace = 'com.openapi.network'
}

dependencies {
    implementation project(':common')
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.core.ktx
    // 对外接口里有 OkHttp、Gson、Glide 的类型，所以用 api
    api libs.okhttp
    api libs.okhttp.logging
    api libs.gson
    api libs.glide
    api libs.glide.okhttp3
}
