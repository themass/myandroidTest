<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live2D 官方样例 · Hiyori(离线)</title>
<style>
:root{color-scheme:light;--gap:.5rem;--surface:Canvas;--text:CanvasText;--line:GrayText;font:90% system-ui}
*{box-sizing:border-box}body{margin:0;color:var(--text);background:#22262b;height:100dvh;display:flex;flex-direction:column}
header,footer{padding:var(--gap);flex:none}header{border-bottom:thin solid var(--line)}h1{font-size:1rem;margin:0 0 var(--gap)}p{margin:.25rem 0;font-size:.8rem}nav{display:flex;flex-wrap:wrap;gap:var(--gap)}button{font:inherit;padding:.4rem .65rem;border:thin solid var(--line);border-radius:.35rem;background:var(--surface);color:var(--text)}main{position:relative;flex:1;min-height:10rem;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}footer{max-height:40dvh;overflow:auto;border-top:thin solid var(--line)}small{display:block;margin-top:var(--gap)}
</style>
<header><h1>Live2D Cubism 4 官方样例模型 Hiyori · 离线渲染</h1></header>

<script src="./live2dcubismcore.min.js"></script>
<script src="./live2d.bundle.js"></script></html>
