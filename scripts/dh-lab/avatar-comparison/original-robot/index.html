<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>原创机器人 · A/B 盲测样件</title>
<style>
:root{font:14px system-ui;color:#17202a;background:#eef1f4}*{box-sizing:border-box}body{margin:0;min-height:100vh}header,footer{padding:12px 16px;background:#fff}header{border-bottom:1px solid #ccd3da}h1{font-size:18px;margin:0 0 4px}p{margin:4px 0;color:#53606d}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px;max-width:1100px;margin:auto}.panel{background:#fff;border:1px solid #ccd3da;border-radius:8px;overflow:hidden}.panel h2{text-align:center;font-size:16px;margin:8px}.stage{height:min(72vh,760px);min-height:420px;background:#f6f7f8}.stage canvas{width:100%;height:100%;display:block}.controls{max-width:1100px;margin:auto;padding:12px 16px}nav{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;padding:7px 12px;background:white;border:1px solid #9aa5b1;border-radius:6px;color:#17202a}button[aria-pressed=true]{background:#24364b;color:white}#status{font-variant-numeric:tabular-nums;font-size:12px}small{display:block;margin-top:8px;color:#53606d}@media(max-width:650px){main{grid-template-columns:1fr}.stage{height:60vh;min-height:360px}}
</style>
<header><h1>原创机器人 · 匿名对照</h1><p>共同输入：640×896 画布、同一组分层 PNG、相同背景与视口比例。</p></header>
<main>
  <section class="panel"><h2>A</h2><div class="stage"><canvas id="stage-a" aria-label="匿名样件 A"></canvas></div></section>
  <section class="panel"><h2>B</h2><div class="stage"><canvas id="stage-b" aria-label="匿名样件 B"></canvas></div></section>
</main>
<section class="controls"><nav aria-label="同步状态">
  <button data-state="neutral" aria-pressed="true">自然</button><button data-state="smile">微笑</button><button data-state="cape">披风</button><button data-state="smile-cape">微笑＋披风</button><button data-motion="idle">待机</button><button data-motion="nod">点头</button><button data-motion="talk">说话动作</button>
</nav><p id="status" role="status">正在加载两个样件…</p><small>内部流程样测。此原创几何机器人不能代表高完成度角色的画质上限；Live2D 一侧为 PSD2Live 导出模型，已知有 18 项 modifier/deformer loss。</small></section>
<script src="./live2d/live2dcubismcore.min.js"></script>
<script src="./runner.bundle.js"></script>
</html>
