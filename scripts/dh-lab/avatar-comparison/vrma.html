<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VRMA 全身动画(离线)</title>
<style>
:root{color-scheme:light;--gap:.5rem;--surface:Canvas;--text:CanvasText;--line:GrayText;font:90% system-ui}
*{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--surface);height:100dvh;display:flex;flex-direction:column}
header,footer{padding:var(--gap);flex:none}header{border-bottom:thin solid var(--line)}h1{font-size:1rem;margin:0 0 var(--gap)}p{margin:.25rem 0;font-size:.8rem}nav{display:flex;flex-wrap:wrap;gap:var(--gap)}button{font:inherit;padding:.4rem .65rem;border:thin solid var(--line);border-radius:.35rem;background:var(--surface);color:var(--text)}main{position:relative;flex:1;min-height:10rem;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}footer{max-height:40dvh;overflow:auto;border-top:thin solid var(--line)}output{font-variant-numeric:tabular-nums}small{display:block;margin-top:var(--gap)}
</style>
<header><h1>VRMA 全身动画:同一 CC0 角色 + 官方动作文件</h1></header>
<main><canvas aria-label="可拖动旋转和双指缩放的 3D 角色,正在播放 VRMA 动画"></canvas></main>
<footer><p id="status" role="status">初始化图形引擎…</p><output id="fps" aria-label="估算渲染帧率"></output><nav aria-label="动画控制"><button id="pause">暂停</button><button id="speed">速度 1×</button><button id="reset">停止动画</button></nav><small>模型:VRoid HairSample_Female(CC0,与「本地 3D 场景」同一文件);动作:pixiv 官方 test.vrma(骨骼 + 表情 + 视线轨道)。three.js / three-vrm / three-vrm-animation:MIT。VRMA 是 pixiv 的跨引擎角色动画格式 —— 动画文件与角色文件分离,可复用。</small></footer>
<script src="./vrma.bundle.js"></script></html>
