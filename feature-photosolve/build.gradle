plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: rootProject.file('gradle/android-library.gradle')

android {
    namespace = 'com.openapi.feature.photosolve'
    buildFeatures {
        compose = true
    }
}

dependencies {
    // 拍照解题：图像处理与模型在 :imaging
    implementation project(':common')
    implementation project(':imaging')
    implementation project(':core')
    // 图像处理（压缩、质量分析、自动裁剪、超分）在 :media
    implementation libs.okhttp

    // 裁剪、文件选择、文档扫描（来自原 app 依赖）
    implementation 'io.github.mr0xf00:easycrop:0.1.1'
    // 拍照：CameraX（原先经 :commonutil 间接获得，改为直接声明）
    implementation 'androidx.camera:camera-core:1.4.0'
    implementation 'androidx.camera:camera-camera2:1.4.0'
    implementation 'androidx.camera:camera-lifecycle:1.4.0'
    implementation 'androidx.camera:camera-view:1.4.0'
    // ProcessCameraProvider.getInstance() 返回 ListenableFuture，本模块直接调用它的 addListener
    // 用完整 Guava：依赖图里已有 Guava，listenablefuture 会被替换成空包。版本与 :app 解析结果一致
    implementation 'com.google.guava:guava:33.3.1-android'
    implementation 'com.anggrayudi:storage:1.5.6'
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'

    // Markdown + LaTeX 渲染（与 :feature-chat 同一套；feature 之间不能互相依赖，所以各声明一份）
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-latex:4.6.2'
    implementation 'io.noties.markwon:inline-parser:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:html:4.6.2'

    // Compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.kotlinx.coroutines.android

    // 纯 Kotlin 逻辑的单测（Markdown/LaTeX 归一化、结果映射、记录编解码）
    testImplementation 'junit:junit:4.13.2'
}

// CameraX 1.4.2 会带进 concurrent-futures-ktx:1.1.0，本机离线缓存里只有 1.2.0 的 jar，
// 不约束的话 :feature-photosolve:testDebugUnitTest 在离线模式下解析失败（其它模块解析到 1.2.0，无影响）。
configurations.configureEach {
    resolutionStrategy {
        force 'androidx.concurrent:concurrent-futures-ktx:1.2.0'
    }
}
