plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace = 'tz.co.hosannahighertech.messagekit'
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles = ["consumer-rules.pro"]
    }

    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/services/javax.annotation.processing.Processor'
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', '../proguard-common.pro'
            consumerProguardFiles "consumer-rules.pro"
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    // 配置Java编译选项，禁用警告
    tasks.withType(JavaCompile) {
        options.compilerArgs += [
            '-nowarn',               // 禁用所有警告
            '-Xlint:none',           // 禁用所有lint警告
            '-Xlint:-deprecation',   // 禁用废弃API警告
            '-Xlint:-unchecked',     // 禁用未检查转换警告
            '-Xlint:-rawtypes',      // 禁用原始类型警告
            '-Xlint:-varargs',       // 禁用可变参数警告
            '-Xlint:-cast',          // 禁用类型转换警告
            '-Xlint:-serial'         // 禁用序列化警告
        ]
        // 确保编译器不报告任何警告
        options.warnings = false
    }
}

dependencies {
    // 本地库文件
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX 库
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
}