apply plugin: 'com.android.library'
apply plugin: 'org.greenrobot.greendao'

android {
    namespace 'com.openai.commonutil'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/maven/com.squareup.okhttp/okhttp/pom.xml'
        exclude 'META-INF/maven/com.squareup.okhttp/okhttp/pom.properties'
        exclude 'META-INF/maven/com.squareup.okio/okio/pom.xml'
        exclude 'META-INF/maven/com.squareup.okio/okio/pom.properties'
        exclude 'META-INF/services/javax.annotation.processing.Processor'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
greendao {
    schemaVersion 6
//    daoPackage 'com.ping.greendao.gen'
//    targetGenDir 'src/main/java'
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    api 'com.google.code.gson:gson:2.10.1'
    api 'org.greenrobot:eventbus:3.0.0'
    api 'jp.wasabeef:glide-transformations:4.3.0'

    api 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
    api 'com.github.bumptech.glide:okhttp3-integration:4.15.1'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'

    api 'com.squareup.okhttp3:logging-interceptor:4.9.3'
    api 'com.squareup.okhttp3:okhttp:4.9.3'
    api 'com.jakewharton:disklrucache:2.0.2'

    api 'com.github.chrisbanes:PhotoView:2.3.0'

    api 'org.greenrobot:greendao:3.3.0'

    api 'com.google.android.exoplayer:exoplayer:2.19.1'
    api 'com.github.CarGuo.GSYVideoPlayer:GSYVideoPlayer:v8.6.0-release-jitpack'

    // 对话框，chat
    api 'tz.co.hosannahighertech:messagekit:1.0.0apha4'
    api 'de.hdodenhof:circleimageview:3.1.0'
    api 'com.github.siyamed:android-shape-imageview:0.9.3'
// 输入框，语音+图片
    api 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.30'
    // PictureSelector basic (Necessary)
    api 'io.github.lucksiege:pictureselector:v3.11.2'
    // image compress library (Not necessary)
    api 'io.github.lucksiege:compress:v3.11.2'
    // uCrop library (Not necessary)
    api 'io.github.lucksiege:ucrop:v3.11.2'
    // simple camerax library (Not necessary)
    api 'io.github.lucksiege:camerax:v3.11.2'

    
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.legacy:legacy-support-v13:1.0.0"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation "androidx.palette:palette:1.0.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.cardview:cardview"
}