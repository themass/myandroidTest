plugins {
    id 'com.android.library'
    id 'org.greenrobot.greendao'
    id 'kotlin-parcelize'
}

android {
    namespace = 'com.openai.commonutil'
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles = ["consumer-rules.pro"]
    }

    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/maven/com.squareup.okhttp/okhttp/pom.xml'
        exclude 'META-INF/maven/com.squareup.okhttp/okhttp/pom.properties'
        exclude 'META-INF/maven/com.squareup.okio/okio/pom.xml'
        exclude 'META-INF/maven/com.squareup.okio/okio/pom.properties'
        exclude 'META-INF/services/javax.annotation.processing.Processor'
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', '../proguard-common.pro'
            consumerProguardFiles "consumer-rules.pro"
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
    
    lintOptions {
        checkReleaseBuilds = false
        abortOnError = false
        ignoreWarnings = true
        quiet = true
        // 抑制弃用警告
        disable 'deprecation'
        // 抑制未检查转换警告
        disable 'unchecked'
        // 抑制其他常见警告
        disable 'all'
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    // 配置Java编译选项，禁用警告
    tasks.withType(JavaCompile) {
        options.compilerArgs += [
            '-nowarn',               // 禁用所有警告
            '-Xlint:none',           // 禁用所有lint警告
            '-Xlint:-deprecation',   // 禁用废弃API警告
            '-Xlint:-unchecked',     // 禁用未检查转换警告
            '-Xlint:-rawtypes',      // 禁用原始类型警告
            '-Xlint:-varargs',       // 禁用可变参数警告
            '-Xlint:-cast',          // 禁用类型转换警告
            '-Xlint:-serial'         // 禁用序列化警告
        ]
        // 确保编译器不报告任何警告
        options.warnings = false
    }
}

greendao {
    schemaVersion 8
}
dependencies {
    // 项目模块依赖
    implementation project(":messagekit")
    
    // 本地库文件
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    // 网络和JSON
    api 'com.google.code.gson:gson:2.13.1'
    api 'com.squareup.okhttp3:okhttp:5.0.0-alpha.14'
    api 'com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.14'
    api 'com.android.volley:volley:1.2.1'
    // 移除DiskLruCache，使用Glide内置缓存替代
    // api 'com.jakewharton:disklrucache:2.0.2'

    // 事件总线
    api 'org.greenrobot:eventbus:3.3.1'

    // 图片加载
    api 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    api 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    api 'com.github.chrisbanes:PhotoView:2.3.0'

    // 数据库
    api 'org.greenrobot:greendao:3.3.0'

    // 视频播放
//    api 'androidx.media3:media3-exoplayer:1.2.1'
//    api 'androidx.media3:media3-datasource:1.2.1'
//    api 'androidx.media3:media3-ui:1.2.1'
//    api 'io.github.carguo:gsyvideoplayer-java:12.0.0'
//    api 'io.github.carguo:gsyvideoplayer-exo2:12.0.0'
//    api 'io.github.carguo:gsyvideoplayer-aliplay:12.0.0'
//    api 'io.github.carguo:gsyvideoplayer-ex_so:12.0.0'

//    api 'io.github.carguo:gsyvideoplayer-arm64:11.1.0'
//    api 'io.github.carguo:gsyvideoplayer-armv7a:11.1.0'


    api 'io.github.carguo:gsyvideoplayer:12.0.0'
        //Whether AliPlayer mode is needed
    api 'io.github.carguo:gsyvideoplayer-aliplay:12.0.0'

    // UI组件
    api 'de.hdodenhof:circleimageview:3.1.0'
    api 'com.github.siyamed:android-shape-imageview:0.9.3'
    api 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.30'

    // 图片选择器
    api 'io.github.lucksiege:pictureselector:v3.11.2'
    api 'io.github.lucksiege:compress:v3.11.2'
    api 'io.github.lucksiege:ucrop:v3.11.2'
    api 'io.github.lucksiege:camerax:v3.11.2'

    // 权限管理 - 使用官方Activity Result API替代EasyPermissions
    // api 'pub.devrel:easypermissions:3.0.0'

    // AndroidX 库
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.fragment:fragment:1.8.5"
    implementation "androidx.activity:activity:1.9.2"
    implementation "androidx.palette:palette:1.0.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    // Apache 工具库 - 升级到最新版本
    // implementation 'org.apache.httpcomponents:httpcore:4.4.16' // 已弃用，使用OkHttp替代
    // 移除Commons库，使用Android内置API替代
    // implementation 'commons-io:commons-io:2.16.1'
    // implementation 'commons-codec:commons-codec:1.17.1'
}