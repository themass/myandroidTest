    api 'io.github.carguo:gsyvideoplayer-arm64:11.1.0'
    api 'io.github.carguo:gsyvideoplayer-armv7a:11.1.0'
//    api 'io.github.carguo:gsyvideoplayer-ex_so:11.1.0'

//    implementation 'io.github.carguo:gsyvideoplayer-armv5:11.1.0'
//    implementation 'io.github.carguo:gsyvideoplayer-x86:11.1.0'
//    implementation 'io.github.carguo:gsyvideoplayer-x64:11.1.0'
    // 对话框，chat
//    api 'tz.co.hosannahighertech:messagekit:1.0.0apha4'
    api 'de.hdodenhof:circleimageview:3.1.0'
    api 'com.github.siyamed:android-shape-imageview:0.9.3'
    // 输入框，语音+图片
    api 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.30'
    // PictureSelector basic (Necessary)
    api 'io.github.lucksiege:pictureselector:v3.11.2'
    // image compress library (Not necessary)
    api 'io.github.lucksiege:compress:v3.11.2'
    // uCrop library (Not necessary)
    api 'io.github.lucksiege:ucrop:v3.11.2'
    // simple camerax library (Not necessary)
    api 'io.github.lucksiege:camerax:v3.11.2'

    api 'com.android.volley:volley:1.2.1'
    api 'pub.devrel:easypermissions:3.0.0'

    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.legacy:legacy-support-v13:1.0.0"
