plugins {
    id 'com.android.library'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: rootProject.file('gradle/android-library.gradle')

android {
    namespace = 'com.openapi.common'
    buildFeatures {
        compose = true
        viewBinding = true
    }
}

dependencies {
    // Compose：主题、对话框、权限请求、分享面板
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.material3
    // 挂起包装 BaseService.await*、事件 Flow
    implementation libs.kotlinx.coroutines.android
    // 分享卡片的二维码
    implementation 'com.google.zxing:core:3.5.3'
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.activity
    implementation libs.androidx.recyclerview
    // FileUtils 用 DocumentFile 处理 SAF 目录
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // 网络层的对外接口里有 Gson、OkHttp、Glide 的类型，所以用 api
    api libs.gson
    api libs.okhttp
    api libs.okhttp.logging
    api libs.glide
    api libs.glide.okhttp3
}