apply plugin: 'com.android.library'
apply plugin: 'org.greenrobot.greendao'
apply plugin: 'kotlin-parcelize'

android {
    namespace 'com.openai.commonutil'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/maven/com.squareup.okhttp/okhttp/pom.xml'
        exclude 'META-INF/maven/com.squareup.okhttp/okhttp/pom.properties'
        exclude 'META-INF/maven/com.squareup.okio/okio/pom.xml'
        exclude 'META-INF/maven/com.squareup.okio/okio/pom.properties'
        exclude 'META-INF/services/javax.annotation.processing.Processor'
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

greendao {
    schemaVersion 8
}
dependencies {
    // 项目模块依赖
    implementation project(":messagekit")
    
    // 本地库文件
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    // 网络和JSON
    api 'com.google.code.gson:gson:2.13.1'
    api 'com.squareup.okhttp3:okhttp:5.1.0'
    api 'com.squareup.okhttp3:logging-interceptor:5.1.0'
    api 'com.android.volley:volley:1.2.1'
    api 'com.jakewharton:disklrucache:2.0.2'

    // 事件总线
    api 'org.greenrobot:eventbus:3.3.1'

    // 图片加载
    api 'com.github.bumptech.glide:glide:5.0.4'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.4'
    api 'com.github.bumptech.glide:okhttp3-integration:5.0.4'
    api 'com.github.chrisbanes:PhotoView:2.3.0'

    // 数据库
    api 'org.greenrobot:greendao:3.3.0'

    // 视频播放
    api 'com.google.android.exoplayer:exoplayer:2.19.1'
    api 'io.github.carguo:gsyvideoplayer-java:11.1.0'
//    api 'io.github.carguo:gsyvideoplayer-exo2:11.1.0'
//    api 'io.github.carguo:gsyvideoplayer-aliplay:11.1.0'
//    api 'io.github.carguo:gsyvideoplayer-arm64:11.1.0'
//    api 'io.github.carguo:gsyvideoplayer-armv7a:11.1.0'
//    implementation("androidx.media3:media3-datasource-rtmp:1.6.1") {
//        exclude("io.antmedia", "rtmp-client")
//    }
//    implementation("com.github.mcxinyu:LibRtmp-Client-for-Android:v3.2.0.m2")

    // UI组件
    api 'de.hdodenhof:circleimageview:3.1.0'
    api 'com.github.siyamed:android-shape-imageview:0.9.3'
    api 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.30'

    // 图片选择器
    api 'io.github.lucksiege:pictureselector:v3.11.3'
    api 'io.github.lucksiege:compress:v3.11.3'
    api 'io.github.lucksiege:ucrop:v3.11.3'
//    api 'io.github.lucksiege:camerax:v3.11.3'

    // 权限管理
    api 'pub.devrel:easypermissions:3.0.0'

    // AndroidX 库
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.legacy:legacy-support-v13:1.0.0"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation "androidx.palette:palette:1.0.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.cardview:cardview"

    // Apache 工具库
    implementation 'org.apache.httpcomponents:httpcore:4.4.16'
    implementation 'commons-io:commons-io:2.20.0'
    implementation 'commons-codec:commons-codec:1.19.0'
}